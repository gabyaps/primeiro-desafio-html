<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wide coverage location</title>

    <!-- Fonte parecida com a do Figma -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <div class="container header__inner">
            <a href="#" class="brand">rideshare</a>

            <nav class="nav">
                <ul class="nav__list">
                    <li><a href="#">Products</a></li>
                    <li><a href="#">Company</a></li>
                    <li><a href="#">Blog</a></li>
                    <li><a href="#">Log in</a></li>
                </ul>
                <a href="#" class="btn btn--primary">Sign up</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container hero__inner">

                <!-- MÍDIA / ILUSTRAÇÃO -------------------------------------------------
                     Troque este <svg> pelo arquivo exportado do Figma:
                     <img src="assets/ilustracao.svg" alt="" class="hero__img">
                ------------------------------------------------------------------- -->
                <div class="hero__media">
                    <svg class="hero__img" viewBox="0 0 460 420" role="img"
                        aria-label="Duas pessoas comemorando com uma medalha">

                        <!-- blob de fundo -->
                        <ellipse cx="235" cy="250" rx="190" ry="150" fill="#DCF2CE" />

                        <!-- sparkles -->
                        <g fill="#5FD3AC">
                            <path class="spark" d="M150 90c4 14 6 16 20 20-14 4-16 6-20 20-4-14-6-16-20-20 14-4 16-6 20-20z" />
                            <path class="spark" d="M330 70c3 10 4 11 14 14-10 3-11 4-14 14-3-10-4-11-14-14 10-3 11-4 14-14z" />
                            <path class="spark" d="M95 250c3 10 4 11 14 14-10 3-11 4-14 14-3-10-4-11-14-14 10-3 11-4 14-14z" />
                            <path class="spark" d="M390 240c2 8 3 9 11 11-8 2-9 3-11 11-2-8-3-9-11-11 8-2 9-3 11-11z" />
                            <path class="spark" d="M250 40c2 8 3 9 11 11-8 2-9 3-11 11-2-8-3-9-11-11 8-2 9-3 11-11z" />
                        </g>

                        <!-- ============ HOMEM ============ -->
                        <g>
                            <!-- pernas -->
                            <path d="M120 300h44v78a12 12 0 0 1-24 0v-40h-4v40a12 12 0 0 1-24 0z" fill="#6FBF48" />
                            <!-- sapatos -->
                            <path d="M104 372h32v14h-32zM148 372h32v14h-32z" fill="#1F2233" />
                            <!-- tronco -->
                            <path d="M112 214c0-18 14-30 30-30s30 12 30 30v92h-60z" fill="#25355C" />
                            <!-- braço levantado (aceno) -->
                            <path d="M158 214c14-22 26-42 40-58a11 11 0 0 1 18 12c-12 18-22 40-32 60z" fill="#25355C" />
                            <circle cx="212" cy="150" r="10" fill="#F1D2AF" />
                            <!-- braço com celular -->
                            <path d="M118 224c-10 16-16 34-14 54a10 10 0 0 0 20 0c0-14 4-28 12-40z" fill="#25355C" />
                            <rect x="98" y="262" width="26" height="40" rx="5" fill="#F0885E" />
                            <circle cx="111" cy="292" r="4" fill="#fff" opacity=".7" />
                            <!-- cabeça -->
                            <circle cx="142" cy="168" r="22" fill="#F1D2AF" />
                            <path d="M120 166c0-16 10-28 24-28s22 10 22 22c-6-6-14-8-22-6-10 3-16 8-18 16-4-1-6-1-6-4z"
                                fill="#1F2233" />
                        </g>

                        <!-- ============ MULHER ============ -->
                        <g>
                            <!-- pernas -->
                            <path d="M232 300h46v80a13 13 0 0 1-25 0v-42h-4v42a13 13 0 0 1-25 0z" fill="#25355C" />
                            <!-- sapatos -->
                            <path d="M214 374h34v14h-34zM262 374h34v14h-34z" fill="#1F2233" />
                            <!-- tronco -->
                            <path d="M224 220c0-18 14-32 31-32s31 14 31 32v86h-62z" fill="#6FBF48" />
                            <!-- braço levantado -->
                            <path d="M280 218c12-24 24-46 40-62a11 11 0 0 1 17 13c-13 17-24 40-33 62z" fill="#6FBF48" />
                            <circle cx="332" cy="150" r="10" fill="#F1D2AF" />
                            <!-- braço baixo -->
                            <path d="M230 230c-9 16-13 34-11 52a10 10 0 0 0 20 0c0-13 3-26 9-38z" fill="#6FBF48" />
                            <!-- medalha -->
                            <path d="M250 214l14 34m18-34l-14 34" stroke="#F4B740" stroke-width="4" fill="none" />
                            <circle cx="262" cy="256" r="12" fill="#F4B740" />
                            <circle cx="262" cy="256" r="6" fill="#fff" opacity=".55" />
                            <!-- cabeça -->
                            <circle cx="257" cy="170" r="22" fill="#F1D2AF" />
                            <!-- cabelo longo -->
                            <path d="M233 172c0-20 12-34 26-34s24 12 24 26c0 6-2 40-6 58-2 8-14 8-15 0-2-14-3-30-6-30s-4 16-6 30c-1 8-13 8-15 0-3-16-5-38-6-50z"
                                fill="#1F2233" />
                            <circle cx="257" cy="170" r="20" fill="#F1D2AF" />
                            <path d="M235 168c0-18 10-30 24-30 8 0 15 4 19 11-5-3-12-4-19-2-11 3-18 10-20 21-2 0-4-1-4-1z"
                                fill="#1F2233" />
                        </g>
                    </svg>
                </div>

                <!-- TEXTO -->
                <div class="hero__content">
                    <h1 class="hero__title">Wide coverage location</h1>
                    <p class="hero__text">
                        Shared rides, There's lots to do in your city, and we've got the
                        rides to help you enjoy it all. And they're all available right
                        from your app.
                    </p>
                    <a href="#" class="link-more">
                        Learn more
                        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                            <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </a>
                </div>

            </div>
        </section>
    </main>
</body>

</html>
